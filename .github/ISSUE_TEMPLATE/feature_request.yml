name: Feature request
description: Suggest an idea for this project
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: The problem or limitation you are facing.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: The solution you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - AI Gateway
        - OpenRouter
        - OpenAI
        - Anthropic
        - xAI
        - Custom OpenAI-compatible endpoint
        - Claude agent
        - Codex agent
        - Gemini CLI agent
        - Workflows
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: adk-llm-bridge and @google/adk versions
      placeholder: adk-llm-bridge 0.7.0, @google/adk 2.4.0
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Node.js
        - Bun
        - Other
  - type: textarea
    id: context
    attributes:
      label: Additional context
