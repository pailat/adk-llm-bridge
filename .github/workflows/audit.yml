name: Dependency audit

on:
  pull_request:
    paths:
      - package.json
      - bun.lock
      - examples/*/package.json
  push:
    branches: [main, "release/**"]
    paths:
      - package.json
      - bun.lock
      - examples/*/package.json
  schedule:
    - cron: "17 6 * * 1" # lunes: capta advisories nuevos sin cambios en el repo
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bun-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # Bloquea en high/critical. Con los overrides actuales el resultado es 0 en todos los niveles.
      - run: bun audit --audit-level=high
      # Informativo: no bloquea, deja las moderadas en el log.
      - run: bun audit --audit-level=moderate
        continue-on-error: true

  # The examples are standalone projects, outside the root lockfile: audit each
  # one's own install (against the packed package), on the same triggers,
  # including the weekly schedule. Blocks on high/critical advisories.
  examples-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: scripts/check-examples.sh --audit
