name: Runtime conformance

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-fixtures:
    name: Deterministic protocol fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck:conformance
      - run: bun run check:conformance
      - run: bun test tests/conformance

  real-runtime:
    name: Real runtime (${{ matrix.runtime }} ${{ matrix.runtime_version }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: ollama
            runtime_version: 0.32.0
            runtime_reference: https://github.com/ollama/ollama/releases/download/v0.32.0/ollama-linux-amd64.tar.zst
            base_url: http://127.0.0.1:11434/v1
            model: qwen2.5:1.5b
          - runtime: vllm
            runtime_version: 0.25.1
            runtime_reference: vllm/vllm-openai-cpu:v0.25.1-x86_64
            base_url: http://127.0.0.1:8000/v1
            model: Qwen/Qwen2.5-1.5B-Instruct
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile

      - name: Start Ollama
        if: matrix.runtime == 'ollama'
        run: |
          curl --fail --show-error --silent --location \
            --output "${RUNNER_TEMP}/ollama-linux-amd64.tar.zst" \
            "${{ matrix.runtime_reference }}"
          sudo tar --zstd --extract \
            --file "${RUNNER_TEMP}/ollama-linux-amd64.tar.zst" \
            --directory /usr
          ollama serve >"${RUNNER_TEMP}/ollama.log" 2>&1 &
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "${ready}" -ne 1 ]; then
            echo "Ollama did not become ready before model pull: runtime=${{ matrix.runtime }} runtimeVersion=${{ matrix.runtime_version }}"
            exit 1
          fi
          ollama pull "${{ matrix.model }}"

      - name: Start vLLM CPU server
        if: matrix.runtime == 'vllm'
        run: |
          docker run --detach --name conformance-vllm \
            --publish 8000:8000 \
            --ipc host \
            "${{ matrix.runtime_reference }}" \
            --model "${{ matrix.model }}" \
            --dtype bfloat16 \
            --max-model-len 2048 \
            --max-num-seqs 1 \
            --enable-auto-tool-choice \
            --tool-call-parser hermes

      - name: Wait for Chat Completions endpoint
        env:
          BASE_URL: ${{ matrix.base_url }}
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent "${BASE_URL}/models" >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "Runtime did not become ready: runtime=${{ matrix.runtime }} runtimeVersion=${{ matrix.runtime_version }} model=${{ matrix.model }}"
          exit 1

      - name: Run real-runtime conformance
        env:
          CONFORMANCE_RUNTIME: ${{ matrix.runtime }}
          CONFORMANCE_RUNTIME_VERSION: ${{ matrix.runtime_version }}
          CONFORMANCE_BASE_URL: ${{ matrix.base_url }}
          CONFORMANCE_MODEL: ${{ matrix.model }}
          CONFORMANCE_REPORT: ${{ runner.temp }}/conformance-${{ matrix.runtime }}.json
        run: bun run scripts/conformance/run-runtime.ts

      - name: Print runtime logs after failure
        if: failure()
        run: |
          if [ "${{ matrix.runtime }}" = "vllm" ]; then
            docker logs conformance-vllm
          else
            tail -n 500 "${RUNNER_TEMP}/ollama.log"
          fi

      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-${{ matrix.runtime }}-${{ matrix.runtime_version }}
          path: ${{ runner.temp }}/conformance-${{ matrix.runtime }}.json
          if-no-files-found: warn
