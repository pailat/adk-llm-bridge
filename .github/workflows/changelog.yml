name: Changelog

# A pull request that changes src/ must add a changes/unreleased/<slug>.md
# fragment, or carry the skip-changelog label when nothing user visible
# changed. A workflow of its own, so adding or removing the label re-runs only
# this check, not the CI matrix.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fragment:
    name: changelog fragment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # The script imports only Node built-ins, so no install is needed.
      - name: Require a fragment for user-visible source changes
        env:
          BASE_REF: ${{ github.base_ref }}
          CHANGELOG_SKIP: ${{ contains(github.event.pull_request.labels.*.name, 'skip-changelog') && 'pull request labeled skip-changelog' || '' }}
        run: bun scripts/changelog.ts check --base "origin/$BASE_REF"
