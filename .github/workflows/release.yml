name: Release

# Publishes to npm when a version tag (vX.Y.Z or vX.Y.Z-pre.N) is pushed.
# Uses npm trusted publishing (OIDC): no NPM_TOKEN secret is stored in the repo,
# and npm attaches a provenance attestation automatically.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Tag matches package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json $version"
            exit 1
          fi
      - name: Tagged commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Tagged commit $GITHUB_SHA is not on main"
            exit 1
          }
      - name: CHANGELOG has a section for this version
        run: grep -q "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md
      - run: bun install --frozen-lockfile
      - run: bun run ci
      - run: bun audit --audit-level=high
      # The tarball built and checked here is the one the publish job uploads,
      # so npm gets exactly the files `bun run ci` verified. Its hash travels
      # as a job output, not inside the artifact, so a swapped artifact fails
      # the check in `publish`.
      - name: Pack the verified build
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          npm pack --pack-destination "$RUNNER_TEMP/package"
          cd "$RUNNER_TEMP/package"
          set -- adk-llm-bridge-*.tgz
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "::error::Expected exactly one tarball, found: $*"
            exit 1
          fi
          sha256=$(sha256sum "$1" | cut -d' ' -f1)
          echo "tarball=$1" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "$sha256  $1" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm
      url: https://www.npmjs.com/package/adk-llm-bridge
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use an npm CLI that supports trusted publishing
        run: npm install --global npm@^11.5.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package
      - name: Check the tarball is the verified one
        working-directory: ${{ runner.temp }}/package
        env:
          EXPECTED_SHA256: ${{ needs.verify.outputs.sha256 }}
          EXPECTED_TARBALL: ${{ needs.verify.outputs.tarball }}
        run: |
          set -- *.tgz
          if [ "$#" -ne 1 ] || [ "$1" != "$EXPECTED_TARBALL" ]; then
            echo "::error::Expected only $EXPECTED_TARBALL, found: $*"
            exit 1
          fi
          if ! printf '%s' "$EXPECTED_SHA256" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::verify did not report a SHA-256"
            exit 1
          fi
          echo "$EXPECTED_SHA256  $1" | sha256sum --check --strict
      - name: Publish the verified tarball
        working-directory: ${{ runner.temp }}/package
        env:
          TARBALL: ${{ needs.verify.outputs.tarball }}
        run: |
          tag=latest
          case "$GITHUB_REF_NAME" in *-*) tag=next ;; esac
          npm publish "./$TARBALL" --provenance --access public --tag "$tag"
      - name: Create GitHub release from CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md --verify-tag $prerelease
